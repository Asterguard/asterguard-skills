# signals.yaml — the SSOT for the drift toolkit.
#
# Every comparator emits typed `signals`; this file is the ONLY place that assigns
# each signal its security `direction` (worse|better|neutral) and `weight` (0..1,
# magnitude of the change it represents). The composer (drift.py) and the explainer
# (explain.py) both read this file, so local and connected runs agree. The AsterVault
# gateway `drift.compare` reads the same taxonomy — adding a signal is a YAML edit here,
# never a code change in a comparator.
#
# `facet` groups a signal as a CAUSE (something an author edited: prompt/tools/controls/
# model/dataset) or an EFFECT (what that did to posture: behavior/surface/sbom). The
# explainer links cause-signals to the effect-signals they predict via `links` below.

signals:
  # --- prompt (cause) ---
  weakened_guardrail:
    facet: prompt
    role: cause
    direction: worse
    weight: 0.45
    title: Guardrail removed or softened
    description: A refusal/boundary clause (never / do not / must not / refuse) was dropped or weakened between versions.
  new_injectable_surface:
    facet: prompt
    role: cause
    direction: worse
    weight: 0.35
    title: New prompt-injection surface
    description: New language tells the agent to follow/obey/execute instructions from context or user input.
  guardrail_added:
    facet: prompt
    role: cause
    direction: better
    weight: 0.30
    title: Guardrail added or strengthened
    description: A new or strengthened refusal/boundary clause was introduced.

  # --- tools (cause) ---
  new_egress_tool:
    facet: tools
    role: cause
    direction: worse
    weight: 0.50
    title: New egress-capable tool
    description: A new effectful tool was added whose reach includes an external/network/egress destination.
  approval_disabled:
    facet: tools
    role: cause
    direction: worse
    weight: 0.55
    title: Human approval disabled
    description: require_tool_approval / HITL gate was turned off on a tool that had it.
  tool_scope_broadened:
    facet: tools
    role: cause
    direction: worse
    weight: 0.40
    title: Tool reach broadened
    description: An existing tool can now reach stores/services it could not in the prior version.
  over_privileged_appeared:
    facet: tools
    role: cause
    direction: worse
    weight: 0.45
    title: Over-privileged tool appeared
    description: A tool is now marked over_privileged_agent (reach exceeds its purpose).
  tool_removed:
    facet: tools
    role: cause
    direction: better
    weight: 0.20
    title: Tool removed
    description: An effectful tool present before is gone — attack surface shrank.
  approval_enabled:
    facet: tools
    role: cause
    direction: better
    weight: 0.30
    title: Human approval enabled
    description: An approval/HITL gate was turned on for a tool that lacked it.

  # --- controls / policy (cause) ---
  control_removed:
    facet: controls
    role: cause
    direction: worse
    weight: 0.50
    title: Control removed
    description: An enforced policy/control present in the prior version is gone.
  control_loosened:
    facet: controls
    role: cause
    direction: worse
    weight: 0.40
    title: Control loosened
    description: A control's state weakened (enforced -> advisory/off) or its scope widened.
  allowlist_widened:
    facet: controls
    role: cause
    direction: worse
    weight: 0.35
    title: Allowlist widened
    description: An egress/identity allowlist gained destinations/principals.
  missing_control_reappeared:
    facet: controls
    role: cause
    direction: worse
    weight: 0.50
    title: Closed gap reopened
    description: A missing_control that a prior version had closed is missing again for the same target.
  control_added:
    facet: controls
    role: cause
    direction: better
    weight: 0.30
    title: Control added
    description: A new enforced control was introduced.

  # --- model (cause) ---
  model_changed:
    facet: model
    role: cause
    direction: neutral
    weight: 0.25
    title: Model changed
    description: The LLM provider/model id changed between versions.
  model_less_restricted:
    facet: model
    role: cause
    direction: worse
    weight: 0.40
    title: Less-restricted model
    description: The new model is flagged less_restricted, or sampling was loosened (higher temperature / no safety system).

  # --- behavior (effect) ---
  new_break:
    facet: behavior
    role: effect
    direction: worse
    weight: 0.60
    title: New proven break
    description: An attack that HELD in the prior version now BROKE (verdict held -> broke) on the same test.
  asr_increased:
    facet: behavior
    role: effect
    direction: worse
    weight: 0.50
    title: ASR increased
    description: Attack success rate at the same budget rose between versions on a matched suite.
  refusal_dropped:
    facet: behavior
    role: effect
    direction: worse
    weight: 0.35
    title: Refusal rate dropped
    description: The agent refused fewer adversarial turns than the prior version.
  break_fixed:
    facet: behavior
    role: effect
    direction: better
    weight: 0.40
    title: Break fixed
    description: An attack that BROKE before now HOLDS (verdict broke -> held).

  # --- surface (effect) ---
  new_attack_path:
    facet: surface
    role: effect
    direction: worse
    weight: 0.60
    title: New attack path
    description: An attack path (untrusted->privileged sink, or regulated store->egress) exists that did not before.
  new_reach_regulated:
    facet: surface
    role: effect
    direction: worse
    weight: 0.50
    title: New regulated-data reach
    description: A regulated data class/store is reachable by an identity that could not reach it before.
  new_egress_sink:
    facet: surface
    role: effect
    direction: worse
    weight: 0.45
    title: New egress sink
    description: A new confidentiality/exfiltration sink appeared in the graph.
  path_closed:
    facet: surface
    role: effect
    direction: better
    weight: 0.40
    title: Attack path closed
    description: An attack path present before is gone.

  # --- sbom / supply chain (effect) ---
  new_kev:
    facet: sbom
    role: effect
    direction: worse
    weight: 0.55
    title: New KEV in dependencies
    description: A dependency now carries a Known-Exploited-Vulnerability that was not present before.
  cve_surface_grew:
    facet: sbom
    role: effect
    direction: worse
    weight: 0.30
    title: CVE surface grew
    description: The count/severity of CVEs across dependencies rose between versions.
  dependency_added:
    facet: sbom
    role: cause
    direction: neutral
    weight: 0.15
    title: Dependency added
    description: A package appears in the SBOM that was not there before.

# links — deterministic cause -> effect correlations the explainer uses to turn a bag
# of signals into a "this edit caused that regression" narrative. A link fires when ALL
# `cause` signals are present AND the `effect` signal is present in the same drift run.
links:
  - cause: [new_egress_tool, approval_disabled]
    effect: new_attack_path
    kind: exfiltration
    narrative: "added an egress-capable tool and disabled its approval gate, opening an exfiltration path"
  - cause: [new_egress_tool]
    effect: new_egress_sink
    kind: exfiltration
    narrative: "the new egress tool introduced an exfiltration sink"
  - cause: [approval_disabled]
    effect: new_break
    kind: tool-abuse
    narrative: "disabling the approval gate let a previously-held attack succeed"
  - cause: [weakened_guardrail]
    effect: asr_increased
    kind: prompt-injection
    narrative: "the weakened guardrail let more adversarial turns land"
  - cause: [weakened_guardrail]
    effect: new_break
    kind: prompt-injection
    narrative: "removing the guardrail turned a held attack into a proven break"
  - cause: [new_injectable_surface]
    effect: new_break
    kind: prompt-injection
    narrative: "the new injectable instruction surface enabled a prompt-injection break"
  - cause: [control_removed]
    effect: new_attack_path
    kind: policy
    narrative: "removing the control reopened an attack path it had closed"
  - cause: [missing_control_reappeared]
    effect: new_reach_regulated
    kind: exfiltration
    narrative: "the reopened control gap made regulated data reachable again"
  - cause: [tool_scope_broadened]
    effect: new_reach_regulated
    kind: over-privilege
    narrative: "the broadened tool reach exposed regulated data"
  - cause: [model_less_restricted]
    effect: asr_increased
    kind: model
    narrative: "the less-restricted model refused fewer attacks"
  - cause: [allowlist_widened]
    effect: new_egress_sink
    kind: exfiltration
    narrative: "the widened allowlist permitted a new egress destination"

# bands — how the aggregate (direction + magnitude) maps to a verdict. Evaluated top-down;
# first match wins. magnitude is the summed weight of worse-signals minus better-signals,
# clamped to [0,1] by the composer.
bands:
  - when: {direction: worse, min_magnitude: 0.6}
    band: critical-regression
  - when: {direction: worse, min_magnitude: 0.3}
    band: regression
  - when: {direction: worse, min_magnitude: 0.0}
    band: minor-regression
  - when: {direction: better, min_magnitude: 0.0}
    band: hardening
  - when: {direction: neutral, min_magnitude: 0.0}
    band: stable
