name: ci

# The release safety net. Every PR and every push to master runs the hermetic smoke gate
# (scripts/smoke.py): the contract validator + the deterministic tool tests + an offline
# pipeline smoke. All hermetic — no model, no gateway, no secrets. The live E2E (gateway +
# real target) is the separate, manually-dispatched live-e2e.yml.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: contract + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML (playbook/persona + signals checks)
        run: python -m pip install --quiet pyyaml

      - name: Smoke — validator + tool tests + offline pipeline
        run: python scripts/smoke.py -v

      - name: External link check (non-blocking — reports broken links in the log)
        run: python scripts/validate.py || true
